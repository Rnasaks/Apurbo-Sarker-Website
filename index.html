<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED - SYSTEM BY SIYAM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: #00ff00;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .glitch {
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 3px 3px 10px red;
            animation: glitch 0.5s infinite alternate;
            position: relative;
        }

        @keyframes glitch {
            0% { transform: skewX(0deg); }
            20% { transform: skewX(-10deg); }
            40% { transform: skewX(10deg); }
            60% { transform: skewX(-5deg); }
            80% { transform: skewX(5deg); }
            100% { transform: skewX(0deg); }
        }
		h2{
			color: red;
		}
        .matrix {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #message {
            font-size: 1.5rem;
            color: white;
            margin-top: 20px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="matrix">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <h1 class="glitch">⚠ SYSTEM BREACHED ⚠</h1>
	<h2>Hacked By Md Siyam</h2>
    <p id="message"></p>

    <audio id="hackingSound" loop>
        <source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
    </audio>

    <script>
        // Random Hacked Messages
        const messages = [
            "ACCESS DENIED!",
            "FIREWALL BREACHED...",
            "DATA ENCRYPTED...",
            "SYSTEM FAILURE!",
            "TRACING LOCATION...",
            "HACK SUCCESSFUL!",
            "INITIATING SELF-DESTRUCT..."
        ];

        const messageElement = document.getElementById("message");
        let index = 0;

        function typeMessage() {
            if (index < messages.length) {
                messageElement.innerText = messages[index];
                index++;
                setTimeout(typeMessage, 2000);
            } else {
                index = 0;
                setTimeout(typeMessage, 2000);
            }
        }

        typeMessage();

        // Background Matrix Effect
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%";
        const matrix = letters.split("");

        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0";
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = matrix[Math.floor(Math.random() * matrix.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Play creepy sound effect
        const sound = document.getElementById("hackingSound");
        sound.volume = 0.3;
        setTimeout(() => {
            sound.play();
        }, 500);
    </script>

</body>
</html>
